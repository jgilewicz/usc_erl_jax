# @package algorithm
name: crossq


learning_rate: 1e-3
buffer_size: 1_000_000
batch_size: 256
gamma: 0.99
train_freq: 1
gradient_steps: 1
learning_starts: 10_000
policy_delay: 3
ent_coef: auto
# rl-zoo3 tuned MuJoCo value: wide critic is central to CrossQ's BN-instead-
# of-target-networks recipe (SBX's own CrossQ default is qf=[1024, 1024])
net_arch:
  pi: [256, 256]
  qf: [2048, 2048]
