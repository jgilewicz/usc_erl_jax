# @package algorithm
name: crossq

# batch-normalised critic, no target networks -> very sample-efficient.
# GPU needs jax[cuda12]; JAX has no MPS backend (falls back to CPU).
learning_rate: 1e-4
buffer_size: 1_000_000
batch_size: 256
gamma: 0.99
train_freq: 1
gradient_steps: 1
learning_starts: 25_000
policy_delay: 1
ent_coef: auto
