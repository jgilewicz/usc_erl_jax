# @package algorithm
# SEMARL shares every ERL parameter 
defaults:
  - erl
  - _self_

name: semarl

# erl.yaml's h_steps is inherited but inert here - it sizes the h-bootstrap
# diagnostic arm only. Selection uses the true return on real generations
# and the batch-averaged critic value on surrogate ones.
p_surr_min: 0.0
p_surr_max: 0.9
p_beta: 3.0
td_ema_decay: 0.1

# Path of an .npz holding every post-warmup real generation's population
# (weights, true and surrogate fitness, fingerprints) for
# scripts/surrogate_benchmark.py. Relative paths go to the Hydra run dir.
dump_path: null

# Critics trained like usc_erl's EnsembleModule (independent init, Bernoulli
# bootstrap masks, shared TD3 target). Scored as the `_ens` arm and dumped
# per member; never selects. 0 = off - each member adds about one critic
# update per env step.
ensemble_size: 0
