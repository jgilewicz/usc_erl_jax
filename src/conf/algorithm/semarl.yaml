# @package algorithm
# SEMARL shares every ERL parameter 
defaults:
  - erl
  - _self_

name: semarl

# erl.yaml's h_steps is inherited but inert here - it sizes the h-bootstrap
# diagnostic arm only. Selection uses the true return on real generations
# and the batch-averaged critic value on surrogate ones.
p_surr_min: 0.0
p_surr_max: 0.9
p_beta: 3.0
td_ema_decay: 0.1
